<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Element Locator Test</title>
</head>
<body>
  <h1>Element Locator Test Page</h1>

  <textarea placeholder="请输入内容" id="testInput"></textarea>
  <button aria-label="发送消息">Send</button>

  <script src="../shared/element-locator.js"></script>
  <script>
    const selectors = {
      deepseek: {
        inputBox: [
          { type: "css", value: "textarea[placeholder*='输入']", priority: 1 },
          { type: "css", value: "textarea.input", priority: 2 },
          { type: "css", value: "div[contenteditable='true']", priority: 3 },
          { type: "xpath", value: "//textarea[@role='textbox']", priority: 4 }
        ],
        sendButton: [
          { type: "css", value: "button[aria-label*='发送']", priority: 1 },
          { type: "css", value: "button.send-button", priority: 2 },
          { type: "xpath", value: "//button[contains(., '发送')]", priority: 3 }
        ]
      }
    };

    // Test script
    async function testLocator() {
      const locator = new ElementLocator("deepseek", selectors);

      try {
        const input = await locator.locate("inputBox");
        console.log("Found input:", input);

        const button = await locator.locate("sendButton");
        console.log("Found button:", button);

        alert("Locator test passed!");
      } catch (error) {
        console.error("Locator test failed:", error);
        alert("Locator test failed: " + error.message);
      }
    }

    testLocator();
  </script>
</body>
</html>
