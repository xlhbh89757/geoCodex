<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GEO 测评助手</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>GEO 效果测评助手</h1>
    </header>

    <section class="upload-section">
      <h2>上传询问词库</h2>
      <input type="file" id="fileInput" accept=".xlsx">
      <div id="fileInfo" class="file-info hidden"></div>
    </section>

    <section class="config-section">
      <h2>测试配置</h2>
      <div class="config-item">
        <label for="platformSelect">平台:</label>
        <select id="platformSelect">
          <option value="deepseek">DeepSeek</option>
          <option value="doubao">豆包</option>
        </select>
      </div>
      <div class="config-item config-item-column">
        <label for="keywordsInput">关键词（每行一个，或用英文逗号分隔）</label>
        <textarea
          id="keywordsInput"
          class="keywords-input"
          rows="4"
          placeholder="德科信息&#10;德科信息技术&#10;德科信息技术有限公司"
        ></textarea>
        <div class="inline-actions">
          <button id="saveKeywordsBtn" class="btn btn-secondary" type="button">保存关键词</button>
          <span id="keywordsStatus" class="keywords-status"></span>
        </div>
      </div>
    </section>

    <section class="control-section">
      <button id="startBtn" class="btn btn-primary" disabled>开始测试</button>
      <button id="pauseBtn" class="btn btn-secondary hidden">暂停</button>
    </section>

    <section class="progress-section hidden" id="progressSection">
      <h2>测试进度</h2>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-text" id="progressText">0 / 0</div>
      <div class="current-question" id="currentQuestion"></div>
      <div class="status-text" id="statusText"></div>
    </section>

    <section class="history-section">
      <h2>历史记录</h2>
      <div id="historyList" class="history-list"></div>
    </section>

    <section class="action-section">
      <button id="reportBtn" class="btn btn-primary" disabled>生成报告</button>
    </section>
  </div>
  <div id="reportRoot"></div>

  <script src="../shared/excel-parser.js"></script>
  <script src="../shared/storage.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
